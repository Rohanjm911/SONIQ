    <rect class="bar b1" x="340" y="0" width="5" height="48" />
    <rect class="bar b5" x="355" y="0" width="5" height="48" />
    <rect class="bar b3" x="370" y="0" width="5" height="48" />
    <rect class="bar b8" x="385" y="0" width="5" height="48" />
    <rect class="bar b10" x="400" y="0" width="5" height="48" />
